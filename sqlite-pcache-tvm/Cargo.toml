[package]
name = "sqlite-pcache-tvm"
version = "0.1.0"
edition = "2021"
description = """
Custom `sqlite3_pcache_methods2` implementation that will route
SQLite's page cache through a TVM (tvm-wasm) page-store region,
unlocking working sets larger than wasm32's 4 GiB ceiling. See
PLAN-tvm-integration.md.

First-commit scope: the registration plumbing + a HashMap-backed
cache that exercises the eleven `sqlite3_pcache_methods2`
trampolines. The TVM `page-store` region backend swaps in for the
HashMap in the follow-up commit; the SQLite-facing surface is
already correct from this commit, so backend swap is contained.
"""
license = "MIT"

[features]
# Force the in-process (HashMap-backed) region on wasm32 as well as
# native. Used by the browser flavor of sqlite-lib so the resulting
# cdylib has exactly one linear memory and can be transpiled by jco
# (which doesn't yet support multi-memory inner core modules).
# Default off  multi-memory is still the preferred wasm32 build for
# the native wasmtime runtime where pool capacity matters.
single-memory = []

[dependencies]
# Same libsqlite3-sys version core/cli use. NOT bundled  the
# bundled compile lives in core, and cargo's `links =`
# uniqueness rule forbids two crates from declaring it. This crate
# just needs the type/binding surface, not the C compile.
libsqlite3-sys = { version = "0.38", default-features = false }
# core is what brings in the bundled sqlite3 build; transitively
# linking it satisfies our extern symbols.
sqlite-component-core = { path = "../core" }
# Guest-side multi-memory substrate. Replaces the legacy
# wit-bindgen-backed `tvm:memory` interface; cold pages live in
# a non-default wasm memory pool, accessed via dispatch helpers
# (`tvm_load_*`, `tvm_copy_to_default`, ...). The `tvm-mm-link`
# static-linker step at sqlite-lib build time satisfies the
# `tvm_mm.*` imports the helpers emit.
tvm-guest-mm-rt = { git = "https://github.com/tegmentum/tvm-wasm.git", tag = "v0.1.0" }
