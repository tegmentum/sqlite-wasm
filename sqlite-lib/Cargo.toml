[package]
name = "sqlite-lib"
version = "0.1.0"
edition = "2021"
publish = false
description = "Programmatic SQLite-in-WASM library. Targets the sqlite-library world: SPI + high-level + low-level + library utility surfaces."

[lib]
crate-type = ["cdylib"]

[features]
# Browser flavor: force pcache-tvm + vfs-tvm onto the in-proc
# backend even on wasm32, so the resulting cdylib has exactly one
# linear memory and can be jco-transpiled. The default (multi-
# memory) build is what scenarios 1 + 2 ship on native wasmtime.
single-memory = [
    "sqlite-pcache-tvm/single-memory",
    "sqlite-vfs-tvm/single-memory",
]

[dependencies]
# Sync wit-bindgen — no async needed; the library world's imports
# are extension-loader + dispatch, both straight host calls.
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }
wit-bindgen = { version = "0.44", features = ["macros"] }
# Shared SQLite wrapper.
sqlite-component-core = { path = "../core" }
# Direct libsqlite3-sys reference for sqlite3_complete + SQLITE_*
# action codes used by the in-WASM authorizer dispatch.
libsqlite3-sys = { version = "0.38" }
# Cold-tier providers. On wasm32 these route SQLite's page cache
# and (optionally) its VFS through pool 1 / pool 2 of the
# `tvm-guest-mm` shell, blowing past the wasm32 4 GiB ceiling.
# `tvm_cold_tier_init()` calls into both crates' `install()`
# entry points exactly once before the first
# `db::Connection::open`.
sqlite-pcache-tvm = { path = "../sqlite-pcache-tvm" }
sqlite-vfs-tvm = { path = "../sqlite-vfs-tvm" }

# Component packaging mirrors the cli crate:
#   cargo build --release --target wasm32-wasip2
#   wasm-tools component new \
#     target/wasm32-wasip2/release/sqlite_lib.wasm \
#     -o target/wasm32-wasip2/release/sqlite_lib.component.wasm
