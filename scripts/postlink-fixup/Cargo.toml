[package]
name = "postlink-fixup"
version = "0.1.0"
edition = "2021"
publish = false
description = """
Post-link fixup pass for sqlite-lib's multi-memory build pipeline.
Two jobs in one tool because they share parser plumbing:

1. **Custom-section forwarding.** `tvm-mm-link` drops custom
   sections (today). The wit-bindgen-emitted `component-type:*`
   sections are what tells `wasm-tools component new` which raw
   imports map to which component interface. We copy them
   verbatim from the pre-link wasm into the linked wasm.

2. **Memory-export alias.** The merged module exports the shell
   pools as `mem0`, `mem1`, …, but `wasm-tools component new`
   expects an export literally named `memory` for the
   component's default memory. We add an alias export
   `(export "memory" (memory 0))` so the component-new step
   knows which linear memory backs the component's loads /
   stores. Pool 0 is the workload's default memory by the
   tvm-guest-mm convention.

When tvm-guest-mm-link gains custom-section forwarding +
optional `--alias-memory0=memory` upstream, this binary can be
deleted.
"""

[dependencies]
wasmparser = "0.236"
wasm-encoder = "0.236"
anyhow = "1"

[[bin]]
name = "postlink-fixup"
path = "src/main.rs"

[workspace]
# Standalone (not in the sqlite-wasm workspace) — this is a host
# build-tool, not a wasm32 artifact.
